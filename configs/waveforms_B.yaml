# Run B waveform dataset. Same as A except the training prior, chosen smooth in the
# run-B coordinates (symmetry.md): uniform in ln(chirp mass) and ln(q), and each spin
# uniform in the disk (chi_z, chi_perp) <=> p(a) ∝ a, tilt ~ U(0, pi).
# Waveforms use canonical labels (q <= 1, tilt in [0, pi]); emulator/box_reparam.py
# applies the random relabelings at train time.
domain:
  type: UniformFrequencyDomain
  f_min: 20.0
  f_max: 1024.0
  delta_f: 0.125

waveform_generator:
  approximant: IMRPhenomXPHM
  f_ref: 20.0
  spin_conversion_phase: 0.0

intrinsic_prior:
  chirp_mass: bilby.core.prior.LogUniform(minimum=10.0, maximum=100.0)
  mass_ratio: bilby.core.prior.LogUniform(minimum=0.125, maximum=1.0)
  a_1: bilby.core.prior.PowerLaw(alpha=1, minimum=0.0, maximum=0.99)
  a_2: bilby.core.prior.PowerLaw(alpha=1, minimum=0.0, maximum=0.99)
  tilt_1: bilby.core.prior.Uniform(minimum=0.0, maximum=3.141592653589793)
  tilt_2: bilby.core.prior.Uniform(minimum=0.0, maximum=3.141592653589793)
  phi_12: default
  phi_jl: default
  theta_jn: default
  phase: default
  luminosity_distance: 100.0
  geocent_time: 0.0

num_samples: 1000000

compression:
  svd:
    size: 200
    num_training_samples: 50000
    num_validation_samples: 10000
  whitening: aLIGO_ZERO_DET_high_P_asd.txt
