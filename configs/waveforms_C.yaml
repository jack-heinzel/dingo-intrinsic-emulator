# Run C waveform dataset. As run B (log-uniform Mc and q, tilt uniform, A's SVD basis), but
# each spin is a 50/50 mix of uniform-in-the-disk and a round Gaussian (sigma 0.1) at a = 0
# (emulator.priors.SpinMixture): smooth in the disk, ~20% of samples below a = 0.1
# (B: ~1%). Needs the repo on PYTHONPATH (slurm/gen_waveforms.sbatch sets it).
domain:
  type: UniformFrequencyDomain
  f_min: 20.0
  f_max: 1024.0
  delta_f: 0.125

waveform_generator:
  approximant: IMRPhenomXPHM
  f_ref: 20.0
  spin_conversion_phase: 0.0

intrinsic_prior:
  chirp_mass: bilby.core.prior.LogUniform(minimum=10.0, maximum=100.0)
  mass_ratio: bilby.core.prior.LogUniform(minimum=0.125, maximum=1.0)
  a_1: emulator.priors.SpinMixture(weight=0.5, sigma=0.1, maximum=0.99)
  a_2: emulator.priors.SpinMixture(weight=0.5, sigma=0.1, maximum=0.99)
  tilt_1: bilby.core.prior.Uniform(minimum=0.0, maximum=3.141592653589793)
  tilt_2: bilby.core.prior.Uniform(minimum=0.0, maximum=3.141592653589793)
  phi_12: default
  phi_jl: default
  theta_jn: default
  phase: default
  luminosity_distance: 100.0
  geocent_time: 0.0

num_samples: 1000000

compression:
  # Run A's 200-mode basis (user, 2026-11-14: same compression as A), extracted from
  # waveforms_A.hdf5. dingo loads it instead of training a new one, so no mismatch
  # check is stored; on 2000 run-B-prior waveforms it gives median 5e-7, 99% 3e-3.
  svd:
    file: /mnt/ceph/users/jheinzel/dingo-intrinsic-emulator/waveforms/svd_A.hdf5
  whitening: aLIGO_ZERO_DET_high_P_asd.txt
