# Run A3: run A's waveform dataset at 3M samples (user, 2026-11-15: scaling test). All 3M
# datasets compress with A's 1M basis (svd_A.hdf5), as B and D already do.
# Run A waveform dataset: stock dingo parameterization and standard priors (detector frame).
domain:
  type: UniformFrequencyDomain
  f_min: 20.0
  f_max: 1024.0
  delta_f: 0.125

waveform_generator:
  approximant: IMRPhenomXPHM
  f_ref: 20.0
  spin_conversion_phase: 0.0

intrinsic_prior:
  chirp_mass: bilby.gw.prior.UniformInComponentsChirpMass(minimum=10.0, maximum=100.0)
  mass_ratio: bilby.gw.prior.UniformInComponentsMassRatio(minimum=0.125, maximum=1.0)
  a_1: bilby.core.prior.Uniform(minimum=0.0, maximum=0.99)
  a_2: bilby.core.prior.Uniform(minimum=0.0, maximum=0.99)
  tilt_1: default
  tilt_2: default
  phi_12: default
  phi_jl: default
  theta_jn: default
  phase: default
  luminosity_distance: 100.0
  geocent_time: 0.0

num_samples: 3000000

compression:
  svd:
    file: /mnt/ceph/users/jheinzel/dingo-intrinsic-emulator/waveforms/svd_A.hdf5
  whitening: aLIGO_ZERO_DET_high_P_asd.txt
