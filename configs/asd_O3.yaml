# O3 noise for H1, L1, V1. Segments are chosen by scripts/thin_psd_segments.py (300 per
# detector, evenly spread over O3), so time_gap and num_psds_max below are not used:
# time_gap only thins within a science segment and barely reduces the ~5700 H1 segments.
dataset_settings:
  f_s: 4096
  time_psd: 1024
  T: 8.0
  window:
    roll_off: 0.4
    type: tukey
  time_gap: 40000
  num_psds_max: 0
  detectors:
    - H1
    - L1
    - V1
  observing_run: O3
